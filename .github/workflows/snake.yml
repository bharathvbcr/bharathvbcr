name: Generate Snake & Stat Cards

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # The publish step replaces the output branch with the contents of dist/,
      # so anything missing here is deleted from the branch. Seed dist/ with what
      # is already published: a generator that fails then leaves the previous
      # card in place instead of breaking the image in the README.
      - name: Seed dist with previously published assets
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output 2>/dev/null; then
            for f in $(git ls-tree --name-only origin/output); do
              git show "origin/output:$f" > "dist/$f" 2>/dev/null || true
            done
          fi
          # Retired cards. Seeded back, they would be published forever.
          # streak-stats.svg: the streaks are now in activity.svg's header.
          rm -f dist/streak-stats.svg
          ls -la dist

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Rendered here from the GitHub API rather than fetched from a hosted
      # widget: the public github-readme-stats deployments either serve an
      # "add a PAT_1 env variable" error card or are paused outright.
      # STATS_TOKEN is optional. Add a fine-grained PAT with read access to your
      # repositories to count private repos; without it the built-in GITHUB_TOKEN
      # is used and the cards show public data only. A rejected STATS_TOKEN falls
      # back automatically and annotates the run with a warning.
      - name: Generate stat cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/gen_stats_cards.py \
            --user "${{ github.repository_owner }}" \
            --out-dir dist \
            || echo "Stat card generation failed; keeping previously published cards"

      - name: Show what will be published
        run: ls -la dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
